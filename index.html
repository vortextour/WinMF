            }
        }

        // 2. MASSIVE 24 LIGHTING EFFECTS ENGINE
        let lightTick = 0;
        let currentLightEffect = 0;
        const totalEffects = 24;

        setInterval(() => { currentLightEffect = (currentLightEffect + 1) % totalEffects; }, 6000);
        setInterval(() => {
            lightTick++;
            bulbsList.forEach((bulb, i) => {
                let hue = 0, sat = '100%', light = '60%', opacity = 1, isOn = true;

                switch(currentLightEffect) {
                    case 0: hue = (i * 10 - lightTick * 10) % 360; break;
                    case 1: isOn = (i % 2 === Math.floor(lightTick / 3) % 2); hue = isOn ? 0 : 240; break;
                    case 2: isOn = Math.random() > 0.6; hue = Math.random() * 360; opacity = isOn ? (Math.random()*0.5+0.5) : 0.15; break;
                    case 3: let sp = Math.abs((lightTick % 70) - 35); isOn = Math.abs(i - sp) < 4; hue = 160; opacity = Math.max(0.1, 1 - Math.abs(i - sp)*0.25); break;
                    case 4: 
                        let p1 = lightTick % 36, p2 = (lightTick + 18) % 36;
                        let d1 = Math.min(Math.abs(i-p1), 36-Math.abs(i-p1)), d2 = Math.min(Math.abs(i-p2), 36-Math.abs(i-p2));
                        if(d1 < 4){ hue = 45; opacity = 1 - d1*0.25; } else if(d2 < 4){ hue = 190; opacity = 1 - d2*0.25; } else { isOn = false; } break;
                    case 5: hue = (lightTick * 3) % 360; opacity = 0.2 + ((Math.sin(lightTick*0.1)+1)/2)*0.8; break;
                    case 6: let cy = Math.floor(lightTick / 36) % 2; isOn = cy === 0 ? (i <= lightTick%36) : (i > lightTick%36); hue = (Math.floor(lightTick/72)*80)%360; break;
                    case 7: isOn = (Math.floor(i/9) % 2 === Math.floor(lightTick/8)%2); hue = isOn ? 300 : 50; break;
                    case 8: if(lightTick%4===0) bulb.dataset.slotHue = [0,50,140,280][Math.floor(Math.random()*4)]; hue = bulb.dataset.slotHue; break;
                    case 9: hue = 5 + 35 * Math.sin(i*0.5 - lightTick*0.3); opacity = 0.5 + 0.5*Math.random(); break;
                    case 10: opacity = Math.max(0.1, Math.sin(lightTick*0.2 + (i%2)*Math.PI)); hue = 280; break;
                    case 11: hue = 45; let gw = (Math.sin(i*0.5 - lightTick*0.15)+1)/2; opacity = 0.2 + gw*0.8; break;
                    case 12: isOn = (i === (lightTick*2)%36 || i === (lightTick*2+18)%36); hue = 320; break;
                    case 13: let mDist = ((lightTick*2)%36 - i + 36) % 36; isOn = mDist < 8; hue = 60; opacity = isOn ? (1 - mDist*0.12) : 0; break;
                    case 14: isOn = Math.random() > 0.5; hue = Math.random() * 360; opacity = isOn ? 1 : 0.2; break;
                    case 15: let sDist = ((lightTick)%36 - i + 36) % 36; isOn = sDist < 5; hue = 120; opacity = isOn ? 1 : 0.1; break;
                    case 16: let np = (Math.sin(lightTick * 0.1) + 1) / 2; hue = np > 0.5 ? 300 : 180; opacity = 0.3 + np*0.7; break;
                    case 17: isOn = Math.random() > 0.8; hue = 200; sat = '20%'; light = '90%'; opacity = isOn ? 1 : 0.2; break;
                    case 18: let hb = lightTick % 20; hue = 0; opacity = (hb===0||hb===1||hb===4||hb===5) ? 1 : 0.2; break;
                    case 19: isOn = true; if(i === Math.floor(lightTick*1.5)%36){ hue=120; opacity=1;} else { hue=i%2===0?0:240; opacity=0.4;} break;
                    case 20: let arm = (i + lightTick) % 12; isOn = arm < 3; hue = 280; opacity = isOn ? (1 - arm*0.2) : 0.1; break;
                    case 21: let bCy = lightTick % 70; let bPos = bCy < 35 ? bCy : 70 - bCy; let bDist2 = Math.abs(i - bPos); isOn = bDist2 < 3; hue = 190; opacity = isOn ? (1 - bDist2*0.3) : 0.1; break;
                    case 22: isOn = Math.random() > 0.1; hue = Math.random()>0.5?300:180; if(Math.random()>0.9) hue=60; opacity = Math.random(); break;
                    case 23: let fl = lightTick % 40; isOn = fl < 5; hue = 0; sat = '0%'; light = '100%'; opacity = isOn ? 1 : 0.1; break;
                }

                if (!isOn) {
                    bulb.style.background = '#374151';
                    bulb.style.boxShadow = 'none';
                    bulb.style.opacity = '0.3';
                    bulb.style.transform = 'translate(-50%, -50%) scale(0.8)';
                } else {
                    let colorStr = `hsl(${hue}, ${sat}, ${light})`;
                    bulb.style.background = colorStr;
                    bulb.style.boxShadow = `0 0 8px ${colorStr}, 0 0 15px ${colorStr}`;
                    bulb.style.opacity = opacity;
                    bulb.style.transform = `translate(-50%, -50%) scale(${1 + (opacity * 0.2)})`;
                }
            });
        }, 50);

        // 3. PERFECT JS PHYSICS ENGINE
        let animationFrameId, lastPegPassed = -1, startRotationCalc = 0;
        let targetRotationCalc = 0, spinStartTime = null, spinDuration = 0;

        function animateWheelPhysics(timestamp) {
            if (!spinStartTime) spinStartTime = timestamp;
            let elapsed = timestamp - spinStartTime;
            let progress = Math.min(elapsed / spinDuration, 1);
            let easeProgress = 1 - Math.pow(1 - progress, 4); 
            
            let currentAngle = startRotationCalc + (targetRotationCalc - startRotationCalc) * easeProgress;
            wheel.style.transform = `rotate(${currentAngle}deg)`;

            let hitOffset = 3; 
            let currentPeg = Math.floor((currentAngle + hitOffset) / degreesPerSegment);
            
            if (currentPeg > lastPegPassed) {
                lastPegPassed = currentPeg;
                pointerBlade.style.transform = `rotate(-14deg)`;
                setTimeout(() => { if (isSpinning) pointerBlade.style.transform = `rotate(0deg)`; }, 70); 
            }

            if (progress < 1) {
                animationFrameId = requestAnimationFrame(animateWheelPhysics);
            } else {
                isSpinning = false;
                currentRotation = targetRotationCalc;
                pointerBlade.style.transform = `rotate(0deg)`; 
                
                let finalMod = 360 - (targetRotationCalc % 360);
                if (finalMod === 360) finalMod = 0;
                let winningIndex = Math.floor(finalMod / degreesPerSegment);
                
                showWinModal(PRIZES[winningIndex]);
            }
        }

        // 4. SPIN LOGIC WITH SPINS COUNT
        function spinWheel() {
            if (isSpinning || spinsLeft <= 0) return;
            
            // Deduct spin
            spinsLeft--;
            isSpinning = true;

            spinBtn.innerText = 'স্পিনিং...';
            spinBtn.classList.remove('btn-glow');
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');
            updateSpinUI();

            const winningIndex = Math.floor(Math.random() * totalSegments);
            const segmentCenter = (winningIndex * degreesPerSegment) + (degreesPerSegment / 2);
            const randomOffset = Math.floor(Math.random() * (degreesPerSegment - 15)) - ((degreesPerSegment - 15) / 2);
            const baseTarget = 360 - segmentCenter + randomOffset;
            
            const currentMod = currentRotation % 360;
            let rotationNeeded = baseTarget - currentMod;
            if (rotationNeeded < 0) rotationNeeded += 360;

            const randomSpinTime = Math.random() * 4 + 6; 
            const extraSpins = Math.floor(randomSpinTime) * 360; 
            
            startRotationCalc = currentRotation;
            targetRotationCalc = currentRotation + rotationNeeded + extraSpins;
            spinDuration = randomSpinTime * 1000;
            spinStartTime = null;
            
            lastPegPassed = Math.floor((startRotationCalc + 3) / degreesPerSegment);

            cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(animateWheelPhysics);
        }

        // 5. MODAL LOGIC FOR BANGLADESHI REWARDS
        function showWinModal(winner) {
            document.getElementById('winPrizeText').innerText = winner.text.replace('\n', ' ');
            const modalIconContainer = document.getElementById('modalIconContainer');
            modalIconContainer.innerHTML = winner.icon;
            
            const svg = modalIconContainer.querySelector('svg');
            svg.classList.remove('w-6', 'h-6', 'md:w-8', 'md:h-8');
            svg.classList.add('w-10', 'h-10', 'md:w-14', 'md:h-14');

            // Dynamic Modal Content Based on Prize Type
            const claimBtn = document.getElementById('claimBtn');
            const modalTitle = document.getElementById('modalTitle');
            const closeBtn = document.getElementById('closeModalBtn');

            if(winner.type === 'spin') {
                modalTitle.innerText = "অসাধারণ!";
                claimBtn.innerText = "স্পিন যোগ করুন";
                closeBtn.classList.add('hidden'); // Force them to click add spins
                
                // Add spins logic handled in the click listener below
                claimBtn.onclick = function() {
                    spinsLeft += winner.amount;
                    closeModal();
                };
            } else if(winner.type === 'none') {
                modalTitle.innerText = "ইসস!";
                claimBtn.innerText = "আবার চেষ্টা করুন";
                closeBtn.classList.add('hidden');
                
                claimBtn.onclick = function() { closeModal(); };
            } else {
                modalTitle.innerText = "অভিনন্দন!";
                claimBtn.innerText = "পুরস্কার সংগ্রহ করুন";
                closeBtn.classList.remove('hidden');
                
                claimBtn.onclick = function() { window.open(CLAIM_URL, '_blank'); };
            }

            document.getElementById('winModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; 

            setTimeout(() => {
                document.getElementById('modalContent').classList.add('modal-active');
                if(winner.type !== 'none') fireConfetti();
            }, 50);
        }

        function closeModal() {
            document.getElementById('modalContent').classList.remove('modal-active');
            setTimeout(() => {
                document.getElementById('winModal').classList.add('hidden');
                document.getElementById('confettiCanvas').classList.add('hidden');
                document.body.style.overflow = ''; 
                updateSpinUI();
            }, 400);
        }

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);

        // 6. CONFETTI ENGINE
        function fireConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            canvas.classList.remove('hidden');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const pieces = [];
            const colors = ['#fcd34d', '#f59e0b', '#ffffff', '#ec4899', '#8b5cf6', '#22d3ee'];

            for (let i = 0; i < 200; i++) {
                pieces.push({
                    x: canvas.width / 2, y: canvas.height / 2,
                    w: Math.random() * 8 + 4, h: Math.random() * 8 + 4,
                    dx: Math.random() * 24 - 12, dy: Math.random() * -25 - 5,
                    rot: Math.random() * 360, rotSpeed: Math.random() * 15 - 7.5,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;
                pieces.forEach(p => {
                    if (p.y < canvas.height) active = true;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                    p.x += p.dx; p.y += p.dy; p.dy += 0.5; p.rot += p.rotSpeed;
                });
                if (active) requestAnimationFrame(render);
                else ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            render();
        }

        spinBtn.addEventListener('click', spinWheel);
        
        // Init
        window.onload = () => {
            drawWheel();
            updateSpinUI();
        };
    </script>
</body>
